  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

BE2;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#202B25;font-variant-numeric:tabular-nums}a{color:#173D30}a:hover{color:#7FA07E}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}button{font-family:inherit}<\u002Fstyle><\u002Fhelmet>\n\n<section data-screen-label=\"00 Cover\" style=\"padding:64px 64px 48px;width:2200px;box-sizing:border-box\">\n  <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:18px\"><span style=\"font:500 12px 'Geist Mono',monospace;letter-spacing:.08em;color:#173D30;padding:6px 10px;border-radius:6px;background:#E6EDE0\">CALOSNAP · UI DESIGN V1.1 · HANDOFF CANDIDATE<\u002Fspan><span style=\"font:500 12px 'Geist Mono',monospace;letter-spacing:.08em;color:#6B4B14;padding:6px 10px;border-radius:6px;background:#F6EBD6\">ALL NUTRITION VALUES ARE MOCK DATA<\u002Fspan><\u002Fdiv>\n  <h1 style=\"font:800 56px/1.05 'Plus Jakarta Sans';letter-spacing:-.03em;margin:0 0 16px\">CaloSnap UI Design v1.1<\u002Fh1>\n  <p style=\"font:500 18px/1.55 'Plus Jakarta Sans';color:#55615A;margin:0 0 36px;max-width:900px;text-wrap:pretty\">The base is Garden: warm ivory, forest green, soft cards. From Ledger it takes horizontal macro bars, the ingredient ledger, the calorie range scale and basis indicators. From Lens it takes the dark camera, framing guidance and fast Precision questions. Food photography is shown as labeled placeholders.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1700px\">\n    <div style=\"background:#F8F5EE;border-radius:20px;padding:22px\"><div style=\"font:700 15px 'Plus Jakarta Sans';margin-bottom:6px\">Estimates, never exact<\u002Fdiv><div style=\"font:500 14px/1.5 'Plus Jakarta Sans';color:#55615A\">Calories appear as a range with a most-likely value. Each ingredient is marked Seen, Estimated or Assumed.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F8F5EE;border-radius:20px;padding:22px\"><div style=\"font:700 15px 'Plus Jakarta Sans';margin-bottom:6px\">Nothing counts until saved<\u002Fdiv><div style=\"font:500 14px/1.5 'Plus Jakarta Sans';color:#55615A\">Scans are drafts. Daily totals change only after Save on the Results review. Meal fit shows the impact as a projected, hatched segment.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F8F5EE;border-radius:20px;padding:22px\"><div style=\"font:700 15px 'Plus Jakarta Sans';margin-bottom:6px\">Minimal input<\u002Fdiv><div style=\"font:500 14px/1.5 'Plus Jakarta Sans';color:#55615A\">Auto asks nothing. Precision asks up to three one-tap questions, and every one can be skipped or ended early.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#F8F5EE;border-radius:20px;padding:22px\"><div style=\"font:700 15px 'Plus Jakarta Sans';margin-bottom:6px\">User-owned targets<\u002Fdiv><div style=\"font:500 14px/1.5 'Plus Jakarta Sans';color:#55615A\">Recommended and manual targets stay separate. Profile changes never overwrite a manual target.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;font:500 13px 'Geist Mono',monospace\">\n    <a href=\"#s01\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">01 Tokens<\u002Fa><a href=\"#s02\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">02 Components<\u002Fa><a href=\"#s03\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">03 Navigation &amp; flows<\u002Fa><a href=\"#s04\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">04 Onboarding<\u002Fa><a href=\"#s05\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">05 Home<\u002Fa><a href=\"#s06\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">06 Scan &amp; analysis states<\u002Fa><a href=\"#s07\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">07 Precision &amp; results<\u002Fa><a href=\"#s08\" style=\"padding:8px 12px;border-radius:8px;background:#fff;text-decoration:none\">08 History &amp; profile<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s01\" data-screen-label=\"01 Tokens\" style=\"padding:56px 64px;width:2200px;box-sizing:border-box;border-top:1px solid #DDD9CD\">\n  <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font:500 13px 'Geist Mono',monospace;color:#5E7F5D\">01<\u002Fspan><h2 style=\"font:800 32px 'Plus Jakarta Sans';letter-spacing:-.02em;margin:0\">Design tokens<\u002Fh2><\u002Fdiv>\n  <p style=\"font:500 15px/1.5 'Plus Jakarta Sans';color:#55615A;margin:8px 0 32px;max-width:860px\">Tokens have semantic names so a dark theme can swap values later. Light mode is the only theme in v1. Typography uses one family, Plus Jakarta Sans, with tabular numerals.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:24px\">\n    <div style=\"background:#fff;border-radius:24px;padding:28px\">\n      <div style=\"font:700 16px 'Plus Jakarta Sans';margin-bottom:18px\">Color<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n        <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"14\">\n          <div><div style=\"height:64px;border-radius:14px;background:{{ c.hex }};box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)\"><\u002Fdiv><div style=\"font:600 12px 'Geist Mono',monospace;margin-top:8px\">{{ c.name }}<\u002Fdiv><div style=\"font:400 11px 'Geist Mono',monospace;color:#55615A\">{{ c.hex }}<\u002Fdiv><div style=\"font:500 12px/1.35 'Plus Jakarta Sans';color:#55615A;margin-top:2px\">{{ c.use }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:24px;padding:28px\">\n      <div style=\"font:700 16px 'Plus Jakarta Sans';margin-bottom:18px\">Type scale<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid #EFECE3;padding-bottom:12px\"><span style=\"font:{{ t.font }}\">{{ t.sample }}<\u002Fspan><span style=\"font:400 11px 'Geist Mono',monospace;color:#55615A;white-space:nowrap\">{{ t.name }} · {{ t.spec }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px\">\n      <div style=\"background:#fff;border-radius:24px;padding:28px\">\n        <div style=\"font:700 16px 'Plus Jakarta Sans';margin-bottom:18px\">Spacing (4 pt base)<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ spaces }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font:500 11px 'Geist Mono',monospace;width:70px\">{{ s.name }}<\u002Fspan><span style=\"height:12px;border-radius:3px;background:#7FA07E;width:{{ s.w }}\"><\u002Fspan><span style=\"font:400 11px 'Geist Mono',monospace;color:#55615A\">{{ s.v }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border-radius:24px;padding:28px\">\n        <div style=\"font:700 16px 'Plus Jakarta Sans';margin-bottom:18px\">Radius &amp; elevation<\u002Fdiv>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:56px;height:56px;background:#E6EDE0;border:1.5px solid #173D30;border-radius:{{ r.v }}\"><\u002Fspan><span style=\"font:400 11px 'Geist Mono',monospace\">{{ r.name }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:500 12px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:16px\">Elevation: cards are flat on ivory (1px soft shadow); sheets use 0 -8 32 rgba(23,61,48,.12); the Scan button uses 0 6 16 rgba(23,61,48,.3). Touch targets ≥ 44 pt.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s02\" data-screen-label=\"02 Components\" style=\"padding:56px 64px;width:2200px;box-sizing:border-box;border-top:1px solid #DDD9CD\">\n  <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font:500 13px 'Geist Mono',monospace;color:#5E7F5D\">02<\u002Fspan><h2 style=\"font:800 32px 'Plus Jakarta Sans';letter-spacing:-.02em;margin:0\">Reusable components<\u002Fh2><\u002Fdiv>\n  <p style=\"font:500 15px/1.5 'Plus Jakarta Sans';color:#55615A;margin:8px 0 32px;max-width:860px\">Every screen below is built from these parts.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px\">\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">BUTTONS<\u002Fdiv>\n      <button style=\"height:54px;border-radius:999px;border:0;background:#173D30;color:#F8F5EE;font:700 15px 'Plus Jakarta Sans'\">Save to diary<\u002Fbutton>\n      <button style=\"height:54px;border-radius:999px;border:1.5px solid #D9D4C6;background:#fff;color:#202B25;font:700 15px 'Plus Jakarta Sans'\">Discard<\u002Fbutton>\n      <button style=\"height:54px;border-radius:999px;border:0;background:#E9E6DB;color:#8B938C;font:700 15px 'Plus Jakarta Sans'\">Continue (disabled)<\u002Fbutton>\n      <span style=\"font:700 14px 'Plus Jakarta Sans';color:#173D30;text-align:center;text-decoration:underline;text-underline-offset:3px\">Use current estimate<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">BASIS INDICATORS<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <span style=\"display:flex;align-items:center;gap:6px;font:700 12px 'Plus Jakarta Sans';padding:6px 10px;border-radius:999px;background:#E6EDE0;color:#173D30\"><span style=\"width:8px;height:8px;border-radius:50%;background:#173D30\"><\u002Fspan>Seen<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:700 12px 'Plus Jakarta Sans';padding:6px 10px;border-radius:999px;background:#F6EBD6;color:#6B4B14\"><span style=\"width:8px;height:8px;border-radius:50%;background:#D9A24E\"><\u002Fspan>Estimated<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px;font:700 12px 'Plus Jakarta Sans';padding:6px 10px;border-radius:999px;background:#EEEBE2;color:#55615A\"><span style=\"width:8px;height:8px;border-radius:50%;border:1.5px dashed #55615A;box-sizing:border-box\"><\u002Fspan>Assumed<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A\"><b style=\"color:#202B25\">Seen<\u002Fb>: the food is visible in the photo. <b style=\"color:#202B25\">Estimated<\u002Fb>: visible, but its portion is inferred. <b style=\"color:#202B25\">Assumed<\u002Fb>: not visible (oil, dressing, sugar); a typical amount was added.<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font:600 12px 'Plus Jakarta Sans';color:#55615A\"><span style=\"display:flex;gap:3px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#173D30\"><\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:#173D30\"><\u002Fspan><span style=\"width:8px;height:8px;border-radius:50%;background:#DDD8CB\"><\u002Fspan><\u002Fspan>Confidence: medium<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">MACRO BAR · CURRENT &amp; PROJECTED<\u002Fdiv>\n      <div><div style=\"display:flex;justify-content:space-between;font:600 13px 'Plus Jakarta Sans'\"><span>Protein<\u002Fspan><span style=\"color:#55615A\">88 / 165 g<\u002Fspan><\u002Fdiv><div style=\"height:8px;border-radius:4px;background:#EDEAE0;margin-top:7px;overflow:hidden\"><div style=\"height:8px;width:53%;background:#173D30\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"display:flex;justify-content:space-between;font:600 13px 'Plus Jakarta Sans'\"><span>Protein<\u002Fspan><span style=\"color:#55615A\">88 <span style=\"color:#6B4B14\">+ 42<\u002Fspan> / 165 g<\u002Fspan><\u002Fdiv><div style=\"height:8px;border-radius:4px;background:#EDEAE0;margin-top:7px;overflow:hidden;display:flex\"><div style=\"height:8px;width:53%;background:#173D30\"><\u002Fdiv><div style=\"height:8px;width:25%;background:repeating-linear-gradient(45deg,#D9A24E 0 3px,#F1D39F 3px 6px)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"font:500 12px/1.45 'Plus Jakarta Sans';color:#55615A\">The hatched gold segment is this meal if you save it. It turns solid only after Save.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">CALORIE RANGE SCALE<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:6px\"><span style=\"font:800 30px 'Plus Jakarta Sans';letter-spacing:-.02em\">610–740<\u002Fspan><span style=\"font:600 13px 'Plus Jakarta Sans';color:#55615A\">kcal<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;height:40px\">\n        <div style=\"position:absolute;top:12px;left:0;right:0;height:6px;border-radius:3px;background:#EDEAE0\"><\u002Fdiv>\n        <div style=\"position:absolute;top:8px;left:27.5%;width:32.5%;height:14px;border-radius:7px;background:#F1D39F\"><\u002Fdiv>\n        <div style=\"position:absolute;top:4px;left:43.7%;width:3px;height:22px;border-radius:2px;background:#173D30\"><\u002Fdiv>\n        <span style=\"position:absolute;top:28px;left:0;font:500 10px 'Geist Mono',monospace;color:#55615A\">500<\u002Fspan><span style=\"position:absolute;top:28px;left:43.7%;transform:translateX(-50%);font:600 10px 'Geist Mono',monospace\">675 likely<\u002Fspan><span style=\"position:absolute;top:28px;right:0;font:500 10px 'Geist Mono',monospace;color:#55615A\">900<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:500 12px/1.45 'Plus Jakarta Sans';color:#55615A\">The band and the tick come straight from the analysis result: likely range and most likely value. Their width reflects the available evidence and is never a fixed percentage. Scale end labels are rounded outward to the nearest 100.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">MODE CONTROL · LIGHT / CAMERA<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;background:#ECE8DD;border-radius:999px;padding:4px;gap:4px\"><span style=\"height:42px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans';color:#173D30\">Auto<\u002Fspan><span style=\"height:42px;border-radius:999px;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans';color:#55615A\">Precision<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#0F1A15;border-radius:20px;padding:12px;display:flex;justify-content:center\"><div style=\"display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:2px\"><span style=\"height:38px;padding:0 18px;border-radius:999px;display:grid;place-items:center;font:700 13px 'Plus Jakarta Sans';color:#C9D4CC\">Auto<\u002Fspan><span style=\"height:38px;padding:0 18px;border-radius:999px;background:#F8F5EE;display:grid;place-items:center;font:700 13px 'Plus Jakarta Sans';color:#173D30\">Precision<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">ANSWER TILES (PRECISION)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n        <span style=\"height:56px;border-radius:16px;border:1.5px solid #DDD8CB;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">½ cup<\u002Fspan>\n        <span style=\"height:56px;border-radius:16px;background:#173D30;color:#F8F5EE;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">1 cup ✓<\u002Fspan>\n        <span style=\"height:56px;border-radius:16px;border:1.5px solid #DDD8CB;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">1½ cups<\u002Fspan>\n        <span style=\"height:56px;border-radius:16px;border:1.5px solid #DDD8CB;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">2 cups<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font:500 12px 'Plus Jakarta Sans';color:#55615A\">Tapping a tile selects it and moves to the next question after 300 ms. \"Skip question\" advances without an answer.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">INGREDIENT ROW · STEPPER<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid #EFECE3\"><span style=\"width:8px;height:8px;border-radius:50%;background:#D9A24E;flex:none\"><\u002Fspan><div style=\"flex:1\"><div style=\"font:700 14px 'Plus Jakarta Sans'\">Jasmine rice<\u002Fdiv><div style=\"font:500 12px 'Plus Jakarta Sans';color:#55615A;margin-top:2px\">~180 g · about 1 cup<\u002Fdiv><\u002Fdiv><span style=\"font:700 15px 'Plus Jakarta Sans'\">210<\u002Fspan><span style=\"width:32px;height:32px;border-radius:10px;background:#F3F0E7;display:grid;place-items:center;font:600 13px 'Plus Jakarta Sans';color:#173D30\">Edit<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"width:48px;height:48px;border-radius:14px;border:1.5px solid #DDD8CB;display:grid;place-items:center;font:600 22px 'Plus Jakarta Sans';color:#173D30\">−<\u002Fspan><div style=\"flex:1;text-align:center\"><div style=\"font:800 22px 'Plus Jakarta Sans'\">225 g<\u002Fdiv><div style=\"font:500 11px 'Plus Jakarta Sans';color:#55615A\">25 g steps<\u002Fdiv><\u002Fdiv><span style=\"width:48px;height:48px;border-radius:14px;border:1.5px solid #DDD8CB;display:grid;place-items:center;font:600 22px 'Plus Jakarta Sans';color:#173D30\">+<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">FEEDBACK<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;background:#173D30;color:#F8F5EE;border-radius:18px;padding:12px 14px\"><span style=\"width:22px;height:22px;border-radius:50%;background:#7FA07E;display:grid;place-items:center;font:700 12px 'Plus Jakarta Sans';color:#0F2A21\">✓<\u002Fspan><span style=\"flex:1;font:600 13px 'Plus Jakarta Sans'\">Lunch saved · 675 kcal<\u002Fspan><span style=\"font:700 13px 'Plus Jakarta Sans';color:#C9DCC8\">Undo<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;background:#F6EBD6;color:#6B4B14;border-radius:14px;padding:10px 14px;font:600 13px 'Plus Jakarta Sans'\"><span style=\"width:8px;height:8px;border-radius:50%;background:#D9A24E\"><\u002Fspan>You're offline. Diary is read-only.<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;background:#F6E3DC;color:#7E3322;border-radius:14px;padding:10px 14px;font:600 13px 'Plus Jakarta Sans'\"><span style=\"width:8px;height:8px;border-radius:50%;background:#A3452F\"><\u002Fspan>Couldn't analyze photo. Try again.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;grid-column:span 2\">\n      <div style=\"font:500 11px 'Geist Mono',monospace;color:#55615A\">TAB BAR · HOME | SCAN | HISTORY<\u002Fdiv>\n      <div style=\"height:86px;background:#fff;border:1px solid #EAE6DA;border-radius:20px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;padding-top:12px;margin-top:20px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"width:22px;height:22px;border-radius:7px;background:#173D30\"><\u002Fspan><span style=\"font:700 11px 'Plus Jakarta Sans';color:#173D30\">Home<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-30px\"><span style=\"width:60px;height:60px;border-radius:50%;background:#173D30;box-shadow:0 6px 16px rgba(23,61,48,.3);display:grid;place-items:center\"><span style=\"width:20px;height:20px;border-radius:50%;border:3px solid #F8F5EE\"><\u002Fspan><\u002Fspan><span style=\"font:700 11px 'Plus Jakarta Sans';color:#173D30\">Scan<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px\"><span style=\"width:22px;height:22px;border-radius:7px;border:2px solid #6B756E;box-sizing:border-box\"><\u002Fspan><span style=\"font:600 11px 'Plus Jakarta Sans';color:#6B756E\">History<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font:500 12px 'Plus Jakarta Sans';color:#55615A\">Scan opens a full-screen camera and hides the tabs. Profile is reached from the avatar on Home. Icons are placeholder shapes until an icon set is chosen.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;grid-column:span 2\">\ =\"font:500 13px 'Plus Jakarta Sans';color:#55615A;margin-top:2px\">{{ g.d }}<\u002Fdiv><\u002Fdiv>\n                <span style=\"width:22px;height:22px;border-radius:50%;border:2px solid {{ g.ring }};box-sizing:border-box;display:grid;place-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ g.dot }}\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:24px;right:24px;bottom:40px\"><button style=\"width:100%;height:56px;border-radius:999px;border:0;background:#173D30;color:#F8F5EE;font:700 16px 'Plus Jakarta Sans'\">Continue<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#173D30;color:#fff\">O2<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Goal selection<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Five MVP goals in plain language. Medical profiles are deferred and not shown. Tap to select.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"O3 About you\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F8F5EE;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px so v>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:210px;background:linear-gradient(180deg,rgba(15,26,21,0),rgba(15,26,21,.92) 45%)\"><\u002Fdiv>\n        <div style=\"position:absolute;bottom:48px;left:34px;right:34px;display:flex;align-items:center;justify-content:space-between\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:52px;height:52px;border-radius:14px;background:repeating-linear-gradient(135deg,#4A5A52 0 6px,#3F4E47 6px 12px);border:2px solid #F8F5EE\"><\u002Fspan><span style=\"font:600 11px 'Plus Jakarta Sans'\">Gallery<\u002Fspan><\u002Fdiv>\n          <span style=\"width:86px;height:86px;border-radius:50%;border:4px solid #F8F5EE;display:grid;place-items:center\"><span style=\"width:68px;height:68px;border-radius:50%;background:#F8F5EE\"><\u002Fspan><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\"><span style=\"width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font:700 18px 'Plus Jakarta Sans'\">?<\u002Fspan><span style=\"font:600 11px 'Plus Jakarta Sans'\">Tips<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#173D30;color:#fff\">S1<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Camera<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Full-screen with tabs hidden. The framing circle and two short tips are the only guidance. Capture is a single still photo; live video analysis is deferred.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"S2 Preview and mode\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#0F1A15;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8;color:#fff\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;inset:0 0 340px 0;background:repeating-linear-gradient(135deg,#3A4A41 0 12px,#33423A 12px 24px);display:grid;place-items:center;font:11px 'Geist Mono',monospace;color:rgba(255,255,255,.6)\">captured photo · chicken rice bowl<\u002Fdiv>\n        <span style=\"position:absolute;top:64px;left:20px;font:700 14px 'Plus Jakarta Sans';color:#fff;padding:12px 16px;border-radius:999px;background:rgba(0,0,0,.45)\">Retake<\u002Fspan>\n        <div style=\"position:absolute;top:400px;left:20px;display:flex;gap:6px\"><span style=\"font:600 12px 'Plus Jakarta Sans';padding:7px 11px;border-radius:999px;background:rgba(15,26,21,.7);color:#fff\">✓ Whole plate visible<\u002Fspan><span style=\"font:600 12px 'Plus Jakarta Sans';padding:7px 11px;border-radius:999px;background:rgba(15,26,21,.7);color:#fff\">✓ Good light<\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:370px;background:#F8F5EE;border-radius:28px 28px 0 0;padding:20px 20px 0\">\n          <div style=\"font:700 17px 'Plus Jakarta Sans';margin:0 4px 12px\">How should we analyze it?<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:#E6EDE0;border:2px solid #173D30\"><div style=\"flex:1\"><div style=\"font:700 15px 'Plus Jakarta Sans'\">Auto<\u002Fdiv><div style=\"font:500 13px 'Plus Jakarta Sans';color:#55615A;margin-top:2px\">Instant estimate, no questions. About 5 s.<\u002Fdiv><\u002Fdiv><span style=\"width:22px;height:22px;border-radius:50%;border:2px solid #173D30;box-sizing:border-box;display:grid;place-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:#173D30\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:#fff;border:2px solid transparent\"><div style=\"flex:1\"><div style=\"font:700 15px 'Plus Jakarta Sans'\">Precision<\u002Fdiv><div style=\"font:500 13px 'Plus Jakarta Sans';color:#55615A;margin-top:2px\">Up to 3 one-tap questions about portions and cooking.<\u002Fdiv><\u002Fdiv><span style=\"width:22px;height:22px;border-radius:50%;border:2px solid #C9C4B6;box-sizing:border-box\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <button style=\"margin-top:16px;width:100%;height:56px;border-radius:999px;border:0;background:#173D30;color:#F8F5EE;font:700 16px 'Plus Jakarta Sans'\">Analyze photo<\u002Fbutton>\n          <div style=\"font:500 11px/1.45 'Plus Jakarta Sans';color:#55615A;text-align:center;margin-top:10px\">Your photo is sent to a third-party AI provider for analysis. Nothing is logged until you review and save.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#173D30;color:#fff\">S2<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Photo preview &amp; mode<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Gallery uploads land here too. On-device quality checks (blur, darkness, plate cut off) prompt a retake before any API cost. Analyze is disabled while offline. A one-time consent sheet before the first upload explains the third-party processing.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"S3 Permission denied\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#0F1A15;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#F8F5EE\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <span style=\"position:absolute;top:64px;left:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font:400 22px/1 system-ui\">×<\u002Fspan>\n        <div style=\"position:absolute;top:240px;left:36px;right:36px;text-align:center\">\n          <div style=\"width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.08);margin:0 auto 20px;display:grid;place-items:center\"><span style=\"width:30px;height:22px;border-radius:6px;border:3px solid #F1D39F;box-sizing:border-box\"><\u002Fspan><\u002Fdiv>\n          <div style=\"font:800 24px/1.2 'Plus Jakarta Sans'\">Camera access is off<\u002Fdiv>\n          <div style=\"font:500 15px/1.55 'Plus Jakarta Sans';color:#C9D4CC;margin-top:10px;text-wrap:pretty\">CaloSnap uses the camera to photograph meals for nutrition analysis. You can also pick a photo from your gallery.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:24px;right:24px;bottom:48px;display:flex;flex-direction:column;gap:10px\">\n          <button style=\"height:56px;border-radius:999px;border:0;background:#F8F5EE;color:#173D30;font:700 16px 'Plus Jakarta Sans'\">Open Settings<\u002Fbutton>\n          <button style=\"height:56px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#F8F5EE;font:700 15px 'Plus Jakarta Sans'\">Choose from gallery instead<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#A3452F;color:#fff\">S3<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Permission denied<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Shown after the system prompt is declined. Gallery is offered as a full alternative, and the same pattern covers photo-library access.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"A1 Analyzing\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#0F1A15;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8;color:#fff\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;inset:0 0 300px 0;background:repeating-linear-gradient(135deg,#3A4A41 0 12px,#33423A 12px 24px)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:250px;height:3px;background:linear-gradient(90deg,transparent,#F1D39F,transparent);box-shadow:0 0 18px #E8B86D\"><\u002Fdiv>\n        <span style=\"position:absolute;top:180px;left:60px;font:600 12px 'Plus Jakarta Sans';padding:6px 10px;border-radius:999px;background:rgba(248,245,238,.92)\">Chicken<\u002Fspan>\n        <span style=\"position:absolute;top:300px;left:200px;font:600 12px 'Plus Jakarta Sans';padding:6px 10px;border-radius:999px;background:rgba(248,245,238,.92)\">Rice<\u002Fspan>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:330px;background:#F8F5EE;border-radius:28px 28px 0 0;padding:24px 24px 0\">\n          <div style=\"font:800 22px 'Plus Jakarta Sans'\">Analyzing your meal<\u002Fdiv>\n          <div style=\"font:500 13px 'Plus Jakarta Sans';color:#55615A;margin:4px 0 18px\">Auto mode · usually 5–10 seconds<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:24px;height:24px;border-radius:50%;background:#173D30;color:#F8F5EE;display:grid;place-items:center;font:700 12px 'Plus Jakarta Sans'\">✓<\u002Fspan><span style=\"font:600 15px 'Plus Jakarta Sans'\">Identifying foods<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:24px;height:24px;border-radius:50%;border:3px solid #E3DFD3;border-top-color:#173D30;box-sizing:border-box\"><\u002Fspan><span style=\"font:600 15px 'Plus Jakarta Sans'\">Estimating portions<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:24px;height:24px;border-radius:50%;border:2px solid #E3DFD3;box-sizing:border-box\"><\u002Fspan><span style=\"font:600 15px 'Plus Jakarta Sans';color:#6B756E\">Matching nutrition data<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;font:700 14px 'Plus Jakarta Sans';color:#173D30;margin-top:26px\">Cancel<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#173D30;color:#fff\">A1<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Analyzing<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Steps reflect real pipeline stages. Food labels fade in as foods are detected, and a gold line scans the photo. After 20 s the screen offers \"Keep waiting\" or \"Cancel\".<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"A2 Analysis failed\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F8F5EE;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <span style=\"position:absolute;top:64px;left:20px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font:400 22px/1 system-ui\">×<\u002Fspan>\n        <div style=\"position:absolute;top:150px;left:24px;right:24px\">\n          <div style=\"height:200px;border-radius:24px;background:repeating-linear-gradient(135deg,#E3DFD3 0 10px,#ECE9DF 10px 20px);display:grid;place-items:center;font:11px 'Geist Mono',monospace;color:#6B756E;opacity:.7\">your photo (dimmed)<\u002Fdiv>\n          <div style=\"font:800 24px/1.2 'Plus Jakarta Sans';margin-top:26px\">We couldn't find food in this photo<\u002Fdiv>\n          <div style=\"font:500 15px/1.55 'Plus Jakarta Sans';color:#55615A;margin-top:10px\">This usually helps:<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px;font:500 14px 'Plus Jakarta Sans'\">\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:50%;background:#173D30\"><\u002Fspan>Move closer so the plate fills the frame<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:50%;background:#173D30\"><\u002Fspan>Use brighter, even light<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:6px;height:6px;border-radius:50%;background:#173D30\"><\u002Fspan>Remove packaging covering the food<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:24px;right:24px;bottom:48px;display:flex;flex-direction:column;gap:10px\">\n          <button style=\"height:56px;border-radius:999px;border:0;background:#173D30;color:#F8F5EE;font:700 16px 'Plus Jakarta Sans'\">Retake photo<\u002Fbutton>\n          <button style=\"height:56px;border-radius:999px;border:1.5px solid #D9D4C6;background:#fff;color:#202B25;font:700 15px 'Plus Jakarta Sans'\">Choose another photo<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#A3452F;color:#fff\">A2<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Analysis failed<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Specific, non-blaming copy. Variants cover no food found, low confidence, service error (\"Try again\") and daily scan limit reached.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"A3 Offline\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F8F5EE;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;top:62px;left:20px;right:20px;display:flex;align-items:center;gap:10px;background:#F6EBD6;color:#6B4B14;border-radius:14px;padding:12px 14px;font:600 13px 'Plus Jakarta Sans'\"><span style=\"width:8px;height:8px;border-radius:50%;background:#D9A24E\"><\u002Fspan>No internet connection<\u002Fdiv>\n        <div style=\"position:absolute;top:150px;left:24px;right:24px\">\n          <div style=\"height:200px;border-radius:24px;background:repeating-linear-gradient(135deg,#E3DFD3 0 10px,#ECE9DF 10px 20px);display:grid;place-items:center;font:11px 'Geist Mono',monospace;color:#6B756E\">your photo<\u002Fdiv>\n          <div style=\"font:800 24px/1.2 'Plus Jakarta Sans';margin-top:26px\">Waiting for a connection<\u002Fdiv>\n          <div style=\"font:500 15px/1.55 'Plus Jakarta Sans';color:#55615A;margin-top:10px;text-wrap:pretty\">New analysis needs an internet connection. Your photo stays on this phone until you try again or discard it. Saved meals remain viewable offline.<\u002Fdiv>\n or:#fff\">U1<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Profile &amp; settings<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Opened from the Home avatar. Photo retention is off by default. \"How estimates work\" explains that photos go to a third-party AI provider and links to that provider's retention terms. Whether History shows thumbnails still needs your decision.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:22px;width:390px;padding:10px\">\n      <div data-screen-label=\"U2 Goals and targets\" style=\"width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative;background:#F8F5EE;box-shadow:0 0 0 10px #16201b,0 24px 50px rgba(0,0,0,.16);font-family:'Plus Jakarta Sans',sans-serif;color:#202B25\">\n        <div style=\"position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:20px;background:#000;z-index:9\"><\u002Fdiv><div style=\"position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:600 15px system-ui;z-index:8\"><span>9:41<\u002Fspan><span style=\"width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px\"><\u002Fspan><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;overflow-y:auto;padding:62px 20px 30px\">\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\"><span style=\"width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font:600 20px system-ui\">‹<\u002Fspan><span style=\"font:800 22px 'Plus Jakarta Sans'\">Goals &amp; targets<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#F6EBD6;border-radius:20px;padding:14px 16px;margin-bottom:14px\">\n            <div style=\"font:700 14px 'Plus Jakarta Sans';color:#6B4B14\">Your recommendation changed<\u002Fdiv>\n            <div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#5A4520;margin-top:4px\">You updated your weight to 64 kg. The new recommendation is 2,000 kcal. Your manual targets were kept.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:10px\"><span style=\"height:38px;padding:0 14px;border-radius:999px;background:#173D30;color:#F8F5EE;display:grid;place-items:center;font:700 13px 'Plus Jakarta Sans'\">Use 2,000<\u002Fspan><span style=\"height:38px;padding:0 14px;border-radius:999px;background:#fff;display:grid;place-items:center;font:700 13px 'Plus Jakarta Sans'\">Keep mine<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px\"><div><div style=\"font:600 12px 'Plus Jakarta Sans';color:#55615A\">Goal<\u002Fdiv><div style=\"font:700 16px 'Plus Jakarta Sans'\">Gym cut<\u002Fdiv><\u002Fdiv><span style=\"font:700 13px 'Plus Jakarta Sans';color:#173D30\">Change<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border-radius:24px;padding:6px 16px 10px\">\n            <div style=\"display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:12px 0 8px;border-bottom:1px solid #EFECE3;font:700 11px 'Plus Jakarta Sans';color:#55615A;letter-spacing:.04em\"><span>TARGET<\u002Fspan><span style=\"text-align:right\">RECOMMENDED<\u002Fspan><span style=\"text-align:right;color:#173D30\">YOURS<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{ tgt }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:1fr 80px 80px;gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #EFECE3\">\n                <span style=\"font:600 15px 'Plus Jakarta Sans'\">{{ t.n }}<\u002Fspan>\n                <span style=\"text-align:right;font:500 14px 'Plus Jakarta Sans';color:#55615A\">{{ t.r }} {{ t.u }}<\u002Fspan>\n                <span style=\"text-align:right;font:800 15px 'Plus Jakarta Sans'\">{{ t.m }} {{ t.u }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;align-items:center;gap:8px;margin-top:12px\"><span style=\"font:700 11px 'Plus Jakarta Sans';padding:4px 8px;border-radius:6px;background:#173D30;color:#F8F5EE\">MANUAL<\u002Fspan><span style=\"font:500 12px 'Plus Jakarta Sans';color:#55615A\">Set by you on 2 Nov · used for meal fit<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:16px\"><span style=\"flex:1;height:52px;border-radius:999px;border:1.5px solid #D9D4C6;background:#fff;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">Reset to recommended<\u002Fspan><span style=\"flex:1;height:52px;border-radius:999px;background:#173D30;color:#F8F5EE;display:grid;place-items:center;font:700 14px 'Plus Jakarta Sans'\">Edit my targets<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 12px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:14px;padding:0 4px\">Changing a target affects today and future days only. Past diary days keep the targets that applied then.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font:600 11px 'Geist Mono',monospace;padding:3px 7px;border-radius:5px;background:#173D30;color:#fff\">U2<\u002Fspan><span style=\"font:700 15px 'Plus Jakarta Sans'\">Goals &amp; targets · manual scenario<\u002Fspan><\u002Fdiv><div style=\"font:500 13px/1.5 'Plus Jakarta Sans';color:#55615A;margin-top:6px\">Mock scenario: the user set 1,900 kcal manually, then their weight changed. The new recommendation is offered and never applied silently.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <div style=\"margin-top:56px;background:#fff;border-radius:24px;padding:28px 32px;max-width:1300px\">\n    <div style=\"font:700 17px 'Plus Jakarta Sans';margin-bottom:12px\">Open decisions before handoff<\u002Fdiv>\n    <ol style=\"margin:0;padding-left:20px;font:500 14px/1.6 'Plus Jakarta Sans';color:#2B3630;display:flex;flex-direction:column;gap:6px\">\n      <li>Photo retention: discard after analysis by default (current design), or keep a small thumbnail for History?<\u002Fli>\n      <li>Sign-in for the private MVP: email magic link, Apple/Google, or invite code?<\u002Fli>\n      <li>Daily scan limit for cost control: should the limit be visible (A2 variant) or silent?<\u002Fli><li>Upper age bound and other eligibility rules for automatic targets (pregnancy and medical conditions are deferred).<\u002Fli>\n      <li>Nutrition Goal Engine spec: energy equation, activity factors, goal adjustments, macro rules and rounding. All values shown are placeholders.<\u002Fli><li>Third-party vision provider choice and its data-retention terms, which the consent copy needs.<\u002Fli>\n      <li>Icon set: placeholder shapes are used throughout. Pick a library (e.g. Phosphor or Lucide) at handoff.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { ans: ['1 cup', 'Pan-fried, oil', null], rice: 225, goal: 'Gym cut', act: 'Very active' };\n  arc(f) { const N = 15; return Array.from({ length: N }, (_, i) => ({ t: `rotate(${(i * 180) / (N - 1)}deg) translateX(-112px)`, c: i < f ? '#173D30' : '#E9E6DB' })); }\n  mac(name, eaten, target) { return { name, eaten, target, left: Math.max(0, target - eaten), pct: Math.min(100, Math.round((eaten / target) * 100)) + '%' }; }\n  renderVals() {\n    const S = this.state;\n    const node = (t, kind, i) => ({ t, arrow: i ? '→' : '', bg: kind === 'c' ? '#173D30' : kind === 'o' ? '#F6EBD6' : kind === 'e' ? '#F6E3DC' : '#F8F5EE', fg: kind === 'c' ? '#F8F5EE' : kind === 'o' ? '#6B4B14' : kind === 'e' ? '#7E3322' : '#202B25', border: kind ? 'none' : '1px solid #E6E2D6' });\n    const fl = (name, note, arr) => ({ name, note, nodes: arr.map(([t, k], i) => node(t, k, i)) });\n    const flows = [\n      fl('Onboarding', 'First launch only. Under 18 → manual targets', [['Welcome'], ['Goal'], ['About you'], ['Activity'], ['Your targets'], ['Adjust targets', 'o'], ['Save profile', 'c'], ['Home (empty day)']]),\n      fl('Scan · Auto', 'No questions', [['Home / Scan tab'], ['Camera'], ['Photo preview + mode'], ['Analyzing'], ['Results review'], ['Edit ingredient', 'o'], ['Save to diary', 'c'], ['Home · totals updated']]),\n      fl('Scan · Precision', 'Max 3 questions. Skip → next question. Use current estimate → Results review', [['Photo preview + mode'], ['Analyzing'], ['Question 1', 'o'], ['Question 2', 'o'], ['Question 3', 'o'], ['Recalculating'], ['Results review'], ['Save to diary', 'c']]),\n      fl('Exceptions', 'Recoverable states', [['Not eligible for auto targets', 'e'], ['Set manual targets'], ['Camera permission denied', 'e'], ['Open Settings / use gallery'], ['Analysis failed', 'e'], ['Retake / another photo'], ['Offline', 'e'], ['Try again / discard']]),\n      fl('History & profile', 'Tabs and Home avatar', [['History tab'], ['Day diary'], ['Saved meal (edit / delete)'], ['Home avatar'], ['Profile & settings'], ['Goals & targets'], ['Save targets', 'c']]),\n    ];\n    const colors = [\n      ['bg', '#F8F5EE', 'Ivory app background'], ['surface', '#FFFFFF', 'Cards, sheets'], ['surface-muted', '#F3F0E7', 'Tiles, inputs'], ['line', '#E6E2D6', 'Dividers, borders'],\n      ['primary', '#173D30', 'Forest. Buttons, active, Seen'], ['accent', '#7FA07E', 'Sage. Fills, success'], ['accent-tint', '#E6EDE0', 'Selected, badges'], ['camera', '#0F1A15', 'Camera & photo stages'],\n      ['estimate', '#D9A24E', 'Estimated, projected'], ['estimate-tint', '#F6EBD6', 'Estimate chips, warnings'], ['text', '#202B25', 'Primary text'], ['text-muted', '#55615A', 'Secondary text (7:1)'],\n      ['danger', '#A3452F', 'Errors, destructive'], ['danger-tint', '#F6E3DC', 'Error surfaces'],\n    ].map(([name, hex, use]) => ({ name, hex, use }));\n    const types = [\n      ['display', \"800 44px/1 'Plus Jakarta Sans'\", '930', '44/800'], ['title-1', \"800 28px 'Plus Jakarta Sans'\", 'Your targets', '28/800'], ['title-2', \"700 22px 'Plus Jakarta Sans'\", 'Chicken rice bowl', '22/700'],\n      ['heading', \"700 17px 'Plus Jakarta Sans'\", 'Meal fit', '17/700'], ['body', \"500 15px 'Plus Jakarta Sans'\", 'Body copy and inputs', '15/500'], ['caption', \"500 13px 'Plus Jakarta Sans'\", 'Breakfast · 08:12', '13/500'], ['micro', \"700 11px 'Plus Jakarta Sans'\", 'TAB LABEL', '11/700'],\n    ].map(([name, font, sample, spec]) => ({ name, font, sample, spec }));\n    const spaces = [['space-1', 4], ['space-2', 8], ['space-3', 12], ['space-4', 16], ['space-5', 20], ['space-6', 24], ['space-8', 32]].map(([name, v]) => ({ name, v: v + ' pt', w: v * 4 + 'px' }));\n    const radii = [['sm 10', '10px'], ['md 16', '16px'], ['lg 24', '24px'], ['sheet 28', '28px'], ['pill', '999px']].map(([name, v]) => ({ name, v }));\n    const week = [['Mon', 10], ['Tue', 11], ['Wed', 12], ['Thu', 13], ['Fri', 14], ['Sat', 15], ['Sun', 16]].map(([w, n]) => ({ w, n, bg: n === 16 ? '#173D30' : '#fff', fg: n === 16 ? '#F8F5EE' : '#202B25' }));\n    const oats = { name: 'Oats & peanut butter', type: 'Breakfast', time: '08:12', kcal: 520, p: 24 };\n    const wrap = { name: 'Turkey wrap', type: 'Snack', time: '10:45', kcal: 600, p: 64 };\n    const bowl = { name: 'Chicken rice bowl', type: 'Lunch', time: '12:41', kcal: 675, p: 42 };\n    const B = { P: 88, C: 120, F: 38 }, M = { P: 42, C: 68, F: 24 }, T = { P: 165, C: 208, F: 62 };\n    const macrosB = [this.mac('Protein', B.P, T.P), this.mac('Carbs', B.C, T.C), this.mac('Fat', B.F, T.F)];\n    const macrosA = [this.mac('Protein', B.P + M.P, T.P), this.mac('Carbs', B.C + M.C, T.C), this.mac('Fat', B.F + M.F, T.F)];\n    const macros0 = [this.mac('Protein', 0, T.P), this.mac('Carbs', 0, T.C), this.mac('Fat', 0, T.F)];\n    const pc = (a, b) => Math.round((a / b) * 100) + '%';\n    const fit = [\n      { name: 'Calories', label: '1,120 + 675 of 2,050', now: pc(1120, 2050), add: pc(675, 2050) },\n      { name: 'Protein', label: '88 + 42 of 165 g', now: pc(88, 165), add: pc(42, 165) },\n      { name: 'Carbs', label: '120 + 68 of 208 g', now: pc(120, 208), add: pc(68, 208) },\n      { name: 'Fat', label: '38 + 24 of 62 g', now: pc(38, 62), add: pc(24, 62) },\n    ];\n    const tag = { Seen: ['#E6EDE0', '#173D30', '#173D30', 'none'], Estimated: ['#F6EBD6', '#6B4B14', '#D9A24E', 'none'], Assumed: ['#EEEBE2', '#55615A', 'transparent', '1.5px dashed #55615A'] };\n    const ingr = [\n      ['Chicken thigh, grilled', '~140 g', 250, 'Seen', '33 g P'], ['Jasmine rice', '~180 g · about 1 cup', 210, 'Estimated', '46 g C'], ['Avocado', '~70 g · about ½ fruit', 110, 'Seen', '10 g F'],\n      ['Edamame', '~40 g', 45, 'Seen', '4 g P'], ['Sesame dressing', '~15 ml · not visible', 60, 'Assumed', '6 g F'],\n    ].map(([name, portion, kcal, basis, macro], i, a) => ({ name, portion, kcal, basis, macro, tagBg: tag[basis][0], tagFg: tag[basis][1], dot: tag[basis][2], dotB: tag[basis][3], border: i < a.length - 1 ? '1px solid #EFECE3' : 'none' }));\n    const qdefs = [\n      { title: 'How much rice was in the bowl?', why: 'Rice is the largest source of uncertainty in this meal.', impact: 'High impact on this estimate', opts: ['½ cup', '1 cup', '1½ cups', '2 cups'], range: '610–740', next: 'Next' },\n      { title: 'How was the chicken cooked?', why: 'Cooking fat usually isn\\u2019t visible in photos.', impact: 'Medium impact on this estimate', opts: ['Grilled, no oil', 'Pan-fried, oil', 'Pan-fried, butter', 'Not sure'], range: '640–715', next: 'Next' },\n      { title: 'Was there dressing or sauce?', why: 'Sauces add calories without showing clearly.', impact: 'Medium impact on this estimate', opts: ['None', 'Light drizzle', 'About 1 tbsp', 'More than 1 tbsp'], range: '675–745', next: 'See results' },\n    ];\n    const qs = qdefs.map((q, qi) => ({ ...q, n: qi + 1, label: `Question ${qi + 1} of 3`,\n      segs: [0, 1, 2].map(k => ({ bg: k < qi ? '#7FA07E' : k === qi ? '#173D30' : '#E3DFD3' })),\n      opts: q.opts.map(o => { const on = S.ans[qi] === o; return { o, on, pick: () => this.setState(s => { const a = [...s.ans]; a[qi] = a[qi] === o ? null : o; return { ans: a }; }), bg: on ? '#173D30' : '#fff', fg: on ? '#F8F5EE' : '#202B25', bd: on ? '1.5px solid #173D30' : '1.5px solid #DDD8CB' }; }),\n      nextBg: S.ans[qi] ? '#173D30' : '#E9E6DB', nextFg: S.ans[qi] ? '#F8F5EE' : '#8B938C', screen: `P${qi + 1} Question ${qi + 1}` }));\n    const riceK = Math.round(S.rice * 1.167);\n    const goalDefs = [['Weight loss', 'Lose fat at a steady, moderate deficit'], ['Healthy weight gain', 'Gain weight gradually with a gentle surplus'], ['Muscle bulk', 'Build muscle with a surplus and high protein'], ['Gym cut', 'Lose fat while keeping muscle. High protein.'], ['Maintain', 'Keep your weight steady']];\n    const goals = goalDefs.map(([t, d]) => { const on = S.goal === t; return { t, d, pick: () => this.setState({ goal: t }), bg: on ? '#E6EDE0' : '#fff', bd: on ? '2px solid #173D30' : '2px solid transparent', dot: on ? '#173D30' : 'transparent', ring: on ? '#173D30' : '#C9C4B6' }; });\n    const actDefs = [['Mostly sitting', 'Desk job, little exercise', '×1.2'], ['Lightly active', '1–2 workouts a week', '×1.375'], ['Moderately active', '3–4 workouts a week', '×1.55'], ['Very active', '5–6 workouts a week', '×1.725'], ['Athlete', 'Daily training or physical job', '×1.9']];\n    const acts = actDefs.map(([t, d, m]) => { const on = S.act === t; return { t, d, m, pick: () => this.setState({ act: t }), bg: on ? '#E6EDE0' : '#fff', bd: on ? '2px solid #173D30' : '2px solid transparent', dot: on ? '#173D30' : 'transparent', ring: on ? '#173D30' : '#C9C4B6' }; });\n    const groups = [{ type: 'Breakfast', items: [oats], empty: false }, { type: 'Snack', items: [wrap], empty: false }, { type: 'Lunch', items: [bowl], empty: false }, { type: 'Dinner', items: [], empty: true }];\n    const set1 = [['Goal', 'Gym cut'], ['Daily targets', 'Recommended · 2,050 kcal'], ['Personal info', '31 · 168 cm · 66 kg'], ['Activity level', 'Very active'], ['Units', 'Metric']].map(([l, v], i, a) => ({ l, v, bd: i < a.length - 1 ? '1px solid #EFECE3' : 'none' }));\n    const set2 = [['Keep meal photos', 'Off'], ['Export my data', ''], ['How estimates work', '']].map(([l, v], i, a) => ({ l, v, bd: i < a.length - 1 ? '1px solid #EFECE3' : 'none' }));\n    const tgt = [['Calories', '2,050', '1,900', 'kcal'], ['Protein', '165', '165', 'g'], ['Carbs', '208', '170', 'g'], ['Fat', '62', '62', 'g']].map(([n, r, m, u]) => ({ n, r, m, u, diff: r !== m }));\n    return {\n      flows, colors, types, spaces, radii, week, qs, goals, acts, groups, set1, set2, tgt, fit, ingr,\n      arc0: this.arc(0), arcB: this.arc(8), arcA: this.arc(13),\n      macrosB, macrosA, macros0, mealsB: [oats, wrap], mealsA: [oats, wrap, bowl],\n      rice: S.rice + ' g', riceK, riceTotal: 465 + riceK, riceCups: '≈ ' + (S.rice / 180).toFixed(2).replace(/\\.?0+$/, '') + ' cup',\n      riceInc: () => this.setState(s => ({ rice: Math.min(450, s.rice + 25) })), riceDec: () => this.setState(s => ({ rice: Math.max(25, s.rice - 25) })),\n      riceSet: [['½ cup', 90], ['1 cup', 180], ['1½ cups', 270]].map(([l, g]) => ({ l, pick: () => this.setState({ rice: g }), bg: S.rice === g ? '#173D30' : '#fff', fg: S.rice === g ? '#F8F5EE' : '#202B25' })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
